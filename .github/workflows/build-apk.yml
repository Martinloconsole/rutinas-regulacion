name: Generar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Preparar los archivos web
        run: |
          mkdir -p www
          cp index.html styles.css app.js manifest.json sw.js icon.svg icon-192.png icon-512.png www/

      - name: Instalar Capacitor y crear proyecto Android
        run: |
          npm install
          npx cap add android

      - name: Poner el ícono de la app
        continue-on-error: true
        run: |
          pip install pillow
          python3 - <<'PY'
          import os, shutil
          from PIL import Image
          res = "android/app/src/main/res"
          shutil.rmtree(res + "/mipmap-anydpi-v26", ignore_errors=True)
          for d, s in (("mdpi", 48), ("hdpi", 72), ("xhdpi", 96), ("xxhdpi", 144), ("xxxhdpi", 192)):
              folder = res + "/mipmap-" + d
              os.makedirs(folder, exist_ok=True)
              img = Image.open("icon-512.png").convert("RGBA").resize((s, s), Image.LANCZOS)
              img.save(folder + "/ic_launcher.png")
              img.save(folder + "/ic_launcher_round.png")
          PY

      - name: Compilar el APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: rutinas-regulacion-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
